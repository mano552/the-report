<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investigator Panel — THE REPORT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/admin.css">
<style>.trend{display:none!important}</style>
</head>
<body>
<div class="admin-header">
  <div class="header-content">
    <a href="/" class="logo-section" style="text-decoration:none;color:inherit;">
      <img src="/assets/logo.png" alt="The Report">
      <div class="logo-text">
        <h1>THE REPORT</h1>
        <p>🔍 INVESTIGATOR PANEL</p>
      </div>
    </a>
    <div style="display:flex;gap:12px;align-items:center;">
      <a href="/investigator" class="back-btn">← Investigator page</a>
    </div>
  </div>
</div>

<div class="container">

  <!-- Stats Overview -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card">
      <div class="stat-number" id="totalNews">0</div>
      <div class="stat-label">Total News</div>
    </div>
  </div>

  <!-- Admin Key -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon">🔐</div>
      <h2>Login</h2>
    </div>
    <div class="form-group full">
      <label>Password <span class="required">*</span></label>
      <input type="password" id="adminKey" autocomplete="current-password">
      <div id="loginStatus" style="margin-top:8px;font-weight:700"></div>
    </div>
  </div>

  <!-- Add News Form -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon">➕</div>
      <h2>Add News Story</h2>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>Language <span class="required">*</span></label>
        <select id="language">
          <option value="english">English</option>
          <option value="urdu">اردو (Urdu)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Category <span class="required">*</span></label>
        <select id="category">
          <option value="trending">🔥 Trending</option>
          <option value="health">Health</option>
          <option value="crime">Crime</option>
          <option value="politics">Politics</option>
          <option value="support">Support</option>
          <option value="education">Education</option>
          <option value="business">Business</option>
          <option value="sports">Sports</option>
          <option value="international">International</option>
          <option value="technology">Technology</option>
          <option value="entertainment">Entertainment</option>
          <option value="general" selected>General</option>
        </select>
      </div>
    </div>

    <div class="form-group full">
      <label>Title <span class="required">*</span></label>
      <input type="text" id="title" placeholder="Enter news title">
    </div>

    <div class="form-group full">
      <label>Short description / Excerpt <small style="font-weight:400;color:#5B6786;">(optional — blank = taken from the full story)</small></label>
      <textarea id="excerpt" placeholder="Enter news description (150-300 characters recommended)"></textarea>
    </div>

    <div class="form-group full">
      <label>Full Story <span class="required">*</span></label>
      <textarea id="body" rows="8" placeholder="Write the full news story. Leave an empty line between paragraphs."></textarea>
    </div>

    <div class="form-group full">
      <label>Source URL (optional)</label>
      <input type="url" id="sourceUrl" placeholder="https://example.com/news-article">
    </div>

    <div class="form-group full">
      <label>News Image <span class="required">*</span> <small style="font-weight:400;color:#5B6786;">(required — news without an image will not display well on the site)</small></label>
      <div class="tab-buttons">
        <button type="button" class="tab-btn active" data-tab="upload">📁 Upload from Gallery</button>
        <button type="button" class="tab-btn" data-tab="url">🔗 Image URL</button>
      </div>

      <div id="upload-tab" class="tab-content active">
        <div class="image-upload-section">
          <p style="margin: 0 0 12px; color: #5B6786;">📤 Select an image from your device</p>
          <input type="file" id="imageFile" accept="image/*">
          <img id="imagePreview" class="image-preview" alt="Preview">
        </div>
      </div>

      <div id="url-tab" class="tab-content">
        <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg">
        <p style="font-size: 0.8rem; color: #5B6786; margin-top: 6px;">Enter direct image URL (must end with .jpg, .png, .webp, etc.)</p>
        <img id="imagePreviewUrl" class="image-preview" alt="Preview">
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>Reporter name <span class="required">*</span></label>
        <input type="text" id="reporterName" maxlength="80" placeholder="Your name (shown on the story)">
      </div>
      <div class="form-group">
        <label>Date &amp; time <span class="required">*</span></label>
        <input type="datetime-local" id="newsDateTime">
      </div>
    </div>

    <div class="form-group full">
      <label>Your photo (reporter photo) <span class="required">*</span> <small style="font-weight:400;color:#5B6786;">(required — shown next to your name)</small></label>
      <input type="file" id="reporterPhotoFile" accept="image/*">
      <img id="reporterPhotoPreview" class="image-preview" alt="Reporter photo" style="max-width:120px;border-radius:50%;">
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>Publish immediately?</label>
        <select id="publishNow">
          <option value="published">✅ Publish now</option>
          <option value="draft">📝 Save as draft</option>
        </select>
      </div>
    </div>

    <div style="margin-top: 24px;">
      <button id="addBtn">✅ Add News Story</button>
      <button type="button" class="secondary" id="resetBtn">🔄 Reset Form</button>
    </div>
    <div id="statusMsg"></div>
  </div>

  <!-- News List -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon">📋</div>
      <h2>My Investigator Stories</h2>
    </div>
    <div class="form-grid" style="margin-bottom: 20px;">
      <div class="form-group" style="display:none">
        <label>Filter by Language</label>
        <select id="filterLang">
          <option value="">All Languages</option>
          <option value="urdu">Urdu Only</option>
          <option value="english">English Only</option>
        </select>
      </div>
      <div class="form-group" style="display:none">
        <label>Filter by Category</label>
        <select id="filterCategory">
          <option value="">All Categories</option>
          <option value="business">Business</option>
          <option value="technology">Technology</option>
          <option value="entertainment">Entertainment</option>
          <option value="sports">Sports</option>
          <option value="health">Health</option>
          <option value="international">International</option>
          <option value="unique">Unique & Amazing</option>
        </select>
      </div>
    </div>
    <div id="newsList">Loading news...</div>
  </div>
</div>

<script>
// Investigator panel: same screens as the author panel, but talks to /api/investigator
// with its own password. Must run BEFORE admin-common.js.
const _fetch = window.fetch.bind(window);
window.fetch = (url, opts = {}) => {
  if (typeof url === 'string' && url.startsWith('/api/news')) {
    url = url.replace('/api/news', '/api/investigator/news');
    const h = { ...(opts.headers || {}) };
    h['x-investigator-key'] = h['x-admin-key'] || '';
    delete h['x-admin-key'];
    opts = { ...opts, headers: h };
  }
  return _fetch(url, opts);
};
// keep this password separate from the admin key in sessionStorage
const _gi = Storage.prototype.getItem, _si = Storage.prototype.setItem;
const _k = (k) => (k === 'thereport_admin_key' ? 'thereport_investigator_key' : k);
Storage.prototype.getItem = function (k) { return _gi.call(this, _k(k)); };
Storage.prototype.setItem = function (k, v) { return _si.call(this, _k(k), v); };
</script>
<script src="/js/admin-common.js"></script>
<script>
  const imageFile = document.getElementById('imageFile');
  const imagePreview = document.getElementById('imagePreview');
  const imageUrl = document.getElementById('imageUrl');
  const imagePreviewUrl = document.getElementById('imagePreviewUrl');
  const languageSelect = document.getElementById('language');
  const titleInput = document.getElementById('title');
  const excerptInput = document.getElementById('excerpt');
  const bodyInput = document.getElementById('body');
  const nameInput = document.getElementById('reporterName');
  const dtInput = document.getElementById('newsDateTime');
  const photoFile = document.getElementById('reporterPhotoFile');
  const photoPreview = document.getElementById('reporterPhotoPreview');
  let reporterPhotoData = null;

  // Tab switching for image upload
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab + '-tab').classList.add('active');
    });
  });

  // Urdu typing direction follows the chosen language
  function applyDir() {
    const ur = languageSelect.value === 'urdu';
    [titleInput, excerptInput, bodyInput].forEach(el => el.classList.toggle('urdu-input', ur));
  }
  languageSelect.addEventListener('change', applyDir);

  // date + time (the reporter's own clock), default = now
  const pad = (n) => String(n).padStart(2, '0');
  function nowLocal() {
    const d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  imageFile.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (event) => { imagePreview.src = event.target.result; imagePreview.classList.add('show'); };
      reader.readAsDataURL(file);
    }
  });

  imageUrl.addEventListener('input', () => {
    if (imageUrl.value) {
      imagePreviewUrl.src = imageUrl.value;
      imagePreviewUrl.classList.add('show');
      imagePreviewUrl.onerror = () => imagePreviewUrl.classList.remove('show');
    } else {
      imagePreviewUrl.classList.remove('show');
    }
  });

  // Reporter photo: centre-cropped to a small square so it stays tiny in the database
  function squarePhoto(file, size = 240) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const s = Math.min(img.width, img.height);
        const c = document.createElement('canvas');
        c.width = c.height = size;
        c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => reject(new Error('Could not read this photo.'));
      img.src = url;
    });
  }
  function showPhoto(data) {
    reporterPhotoData = data;
    photoPreview.src = data;
    photoPreview.classList.add('show');
  }
  photoFile.addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      showPhoto(await squarePhoto(f));
      try { localStorage.setItem('inv_photo', reporterPhotoData); } catch (_) {}
    } catch (err) { showStatus('❌ ' + err.message, 'error'); }
  });
  nameInput.addEventListener('change', () => { try { localStorage.setItem('inv_name', nameInput.value.trim()); } catch (_) {} });

  function restoreReporter() {
    try {
      const n = localStorage.getItem('inv_name'), p = localStorage.getItem('inv_photo');
      if (n) nameInput.value = n;
      if (p) showPhoto(p);
    } catch (_) {}
  }

  function refresh() {
    loadNewsList({
      listEl: document.getElementById('newsList'),
      totalEl: document.getElementById('totalNews'),
      filterLangId: 'filterLang',
      filterCatId: 'filterCategory',
      onAfterRender: () => {},
    });
  }

  document.getElementById('filterLang').addEventListener('change', refresh);
  document.getElementById('filterCategory').addEventListener('change', refresh);
  wireKeyReload(refresh);

  document.getElementById('addBtn').addEventListener('click', async () => {
    const title = titleInput.value.trim();
    const storyBody = bodyInput.value.trim();
    const excerpt = excerptInput.value.trim() || storyBody.replace(/\s+/g, ' ').slice(0, 300);
    const category = document.getElementById('category').value;
    const language = languageSelect.value;
    const sourceUrl = document.getElementById('sourceUrl').value.trim();
    const status = document.getElementById('publishNow').value;
    const reporterName = nameInput.value.trim();

    if (!title) return showStatus('❌ Please enter a headline', 'error');
    if (!storyBody) return showStatus('❌ Please write the full story', 'error');

    let imageData = null;
    const activeTab = document.querySelector('.tab-btn.active').dataset.tab;
    if (activeTab === 'upload' && imageFile.files[0]) {
      imageData = await compressImageFile(imageFile.files[0]);
    } else if (activeTab === 'url' && imageUrl.value) {
      imageData = imageUrl.value;
    }
    if (!imageData) return showStatus('❌ Please add a news image (upload or URL) — it is compulsory.', 'error');
    if (!reporterName) return showStatus('❌ Please enter the reporter name', 'error');
    if (!reporterPhotoData) return showStatus('❌ Please add your own photo (reporter photo) — it is compulsory.', 'error');
    if (!dtInput.value) return showStatus('❌ Please choose the date and time', 'error');

    const body = {
      title, excerpt, body: storyBody, category, language,
      sourceUrl: sourceUrl || null,
      date: new Date(dtInput.value).toISOString(),
      image: imageData, reporterName, reporterPhoto: reporterPhotoData,
      featured: false, trending: category === 'trending', status,
    };

    try {
      const res = await fetch('/api/news', { method: 'POST', headers: headers(), body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to add news');
      showStatus('✅ News story added successfully!', 'success');
      document.getElementById('resetBtn').click();
      refresh();
    } catch (err) {
      showStatus('❌ Error: ' + err.message, 'error');
    }
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    titleInput.value = '';
    excerptInput.value = '';
    bodyInput.value = '';
    document.getElementById('category').value = 'general';
    languageSelect.value = 'english';
    document.getElementById('sourceUrl').value = '';
    dtInput.value = nowLocal();
    imageFile.value = '';
    imageUrl.value = '';
    document.getElementById('publishNow').value = 'published';
    imagePreview.classList.remove('show');
    imagePreviewUrl.classList.remove('show');
    applyDir();
  });

  dtInput.value = nowLocal();
  restoreReporter();
  applyDir();
  refresh();
</script>
<script>
async function checkLogin() {
  const el = document.getElementById('loginStatus');
  if (!keyInput.value) { el.textContent = ''; return; }
  try {
    const res = await _fetch('/api/investigator/me', { headers: { 'x-investigator-key': keyInput.value } });
    const d = await res.json();
    if (res.ok) { el.style.color = '#155724'; el.textContent = '✅ Logged in as ' + d.name; }
    else { el.style.color = '#721c24'; el.textContent = '❌ ' + (d.error || 'Wrong password.'); }
  } catch (e) { el.style.color = '#721c24'; el.textContent = '❌ Could not reach the server.'; }
}
keyInput.addEventListener('change', checkLogin);
keyInput.addEventListener('input', () => { clearTimeout(window.__lt); window.__lt = setTimeout(checkLogin, 700); });
checkLogin();
</script>
</body>
</html>
